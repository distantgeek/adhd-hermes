---
# adhd-hermes post-deploy configuration
# Usage: ansible-playbook configure.yml -i <host>, -u kevbot --private-key ~/.ssh/id_ed25519_kevbotmini
#
# This playbook is run after a fresh bootc deploy, upgrade, or switch to configure
# host-specific settings that are not baked into the image.

- name: Configure adhd-hermes appliance
  hosts: all
  become: true
  vars:
    hermes_user: kevbot
    hermes_home: "/var/home/{{ hermes_user }}"
    lan_cidr: "192.168.0.0/16"

  tasks:
    # --- Cleanup: legacy adhd-claw-os artifacts ---
    # These are safe to remove after switching from adhd-claw-os.
    # If running on a fresh install, these tasks are no-ops.

    - name: Stop legacy OpenClaw container if present
      ansible.builtin.systemd:
        name: openclaw
        state: stopped
        enabled: false
        scope: system
      failed_when: false
      tags: [cleanup]

    - name: Stop legacy Ollama container if present
      ansible.builtin.systemd:
        name: ollama
        state: stopped
        enabled: false
        scope: system
      failed_when: false
      tags: [cleanup]

    - name: Remove legacy system Quadlets
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/containers/systemd/openclaw.container
        - /etc/containers/systemd/ollama.container
        - /etc/containers/systemd/adhd-claw.network
      tags: [cleanup]

    - name: Remove legacy OpenClaw environment file
      ansible.builtin.file:
        path: /etc/openclaw/env
        state: absent
      tags: [cleanup]

    - name: Remove legacy adhd-claw podman network
      ansible.builtin.command:
        cmd: podman network rm adhd-claw
      failed_when: false
      changed_when: false
      tags: [cleanup]

    - name: Reload systemd after cleanup
      ansible.builtin.systemd:
        daemon_reload: true
      tags: [cleanup]

    # --- User setup ---

    - name: Ensure podman group exists
      ansible.builtin.group:
        name: podman
        system: true
        state: present
      tags: [user]

    - name: Ensure primary user exists
      ansible.builtin.user:
        name: "{{ hermes_user }}"
        groups: wheel,podman
        shell: /bin/bash
      tags: [user]

    - name: Enable linger for primary user
      ansible.builtin.command:
        cmd: loginctl enable-linger {{ hermes_user }}
      changed_when: false
      tags: [user]

    - name: Ensure NetworkManager-wait-online is enabled
      ansible.builtin.systemd:
        name: NetworkManager-wait-online.service
        state: started
        enabled: true
      tags: [network]

    # --- Firewall ---

    - name: Ensure firewalld is running and enabled
      ansible.builtin.systemd:
        name: firewalld
        state: started
        enabled: true
      tags: [firewall]

    - name: Add adhd-hermes service to firewalld
      ansible.posix.firewalld:
        service: adhd-hermes
        state: enabled
        permanent: true
        immediate: true
      tags: [firewall]

    - name: Restrict port 9119 to LAN only
      ansible.builtin.command:
        cmd: firewall-cmd --permanent --add-rich-rule='rule family="ipv4" source address="{{ lan_cidr }}" port port="9119" protocol="tcp" accept'
      changed_when: false
      tags: [firewall]

    - name: Also apply the LAN restriction immediately
      ansible.builtin.command:
        cmd: firewall-cmd --add-rich-rule='rule family="ipv4" source address="{{ lan_cidr }}" port port="9119" protocol="tcp" accept'
      changed_when: false
      tags: [firewall]

    - name: Reload firewalld
      ansible.builtin.command:
        cmd: firewall-cmd --reload
      changed_when: false
      tags: [firewall]

    # --- Hermes data directories ---
    # On bootc systems, user home is /var/home/<user>, not /home/<user>.

    - name: Ensure Hermes data directory exists
      ansible.builtin.file:
        path: "{{ hermes_home }}/.hermes"
        state: directory
        owner: "{{ hermes_user }}"
        group: "{{ hermes_user }}"
        mode: "0700"
      tags: [hermes]

    - name: Ensure Hermes subdirectories exist
      ansible.builtin.file:
        path: "{{ hermes_home }}/.hermes/{{ item }}"
        state: directory
        owner: "{{ hermes_user }}"
        group: "{{ hermes_user }}"
        mode: "0755"
      loop:
        - cron
        - sessions
        - logs
        - hooks
        - memories
        - skills
        - skins
        - plans
        - workspace
        - home
      tags: [hermes]

    # --- Deploy Quadlets ---

    - name: Ensure user Quadlet directory exists
      ansible.builtin.file:
        path: "{{ hermes_home }}/.config/containers/systemd"
        state: directory
        owner: "{{ hermes_user }}"
        group: "{{ hermes_user }}"
        mode: "0755"
      tags: [quadlets]

    - name: Deploy gateway Quadlet
      ansible.builtin.copy:
        src: "../../quadlets/adhd-hermes-gateway.container"
        dest: "{{ hermes_home }}/.config/containers/systemd/adhd-hermes-gateway.container"
        owner: "{{ hermes_user }}"
        group: "{{ hermes_user }}"
        mode: "0644"
      tags: [quadlets]

    - name: Deploy dashboard Quadlet
      ansible.builtin.copy:
        src: "../../quadlets/adhd-hermes-dashboard.container"
        dest: "{{ hermes_home }}/.config/containers/systemd/adhd-hermes-dashboard.container"
        owner: "{{ hermes_user }}"
        group: "{{ hermes_user }}"
        mode: "0644"
      tags: [quadlets]

    # --- Systemd services ---

    - name: Reload user systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true
        scope: user
      become: false
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_user_uid }}"
      tags: [systemd]

    - name: Ensure gateway service is enabled
      ansible.builtin.systemd:
        name: adhd-hermes-gateway
        scope: user
        enabled: true
        state: started
      become: false
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_user_uid }}"
      tags: [systemd, hermes]

    - name: Ensure dashboard service is enabled
      ansible.builtin.systemd:
        name: adhd-hermes-dashboard
        scope: user
        enabled: true
        state: started
      become: false
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_user_uid }}"
      tags: [systemd, hermes]